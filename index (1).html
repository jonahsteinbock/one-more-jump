<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2b"><title>One More Jump</title><style>*{box-sizing:border-box}body{margin:0;background:#101a2b;color:#f5f7fc;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center}header,footer{width:min(100%,800px);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0}.btn{border:1px solid #7085a4;border-radius:10px;padding:10px 13px;color:white;background:#243651;cursor:pointer;font:inherit}main{width:min(100%,800px);padding:0 12px}.hud{display:flex;justify-content:space-between;padding:10px 4px;font-weight:750}#game{display:block;width:100%;height:auto;aspect-ratio: 16/10;border-radius:16px;background:#172840;touch-action:none;cursor:pointer;box-shadow:0 14px 45px #0005}.help{text-align:center;color:#bac9dc;font-size:14px;margin:12px 0}.ad{border:1px dashed #677a92;border-radius:10px;color:#aebdd0;min-height:64px;display:grid;place-items:center;text-align:center;font-size:12px;padding:12px;width:min(100%,800px);margin:16px 12px 0}footer{color:#b6c7da;font-size:12px;flex-wrap:wrap}a{color:#b8dfff}#status{font-size:13px;color:#b6c7da}@media(max-width:500px){h1{font-size:17px}.btn{padding:9px 10px}header{padding:10px 12px}}</style></head><body><header><h1>◆ ONE MORE JUMP</h1><div><button class="btn" id="mute" aria-label="Mute sound">♫ Sound on</button> <button class="btn" id="restart">Restart ↻</button></div></header><main><div class="hud"><span id="score">SCORE 0</span><span id="best">BEST 0</span></div><canvas id="game" width="800" height="500" aria-label="Jump over obstacles by tapping or pressing space" tabindex="0"></canvas><p class="help">Tap / click / press Space or ↑ to jump · Double jump in midair</p><p id="status" role="status">Tap to begin.</p></main><section class="ad" aria-label="Reserved advertising area">Reserved advertising space — no ads are currently served</section><footer><span>Original arcade game · No account required · Best score stays on this device</span><span><a href="privacy.html">Privacy & advertising</a></span></footer><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),S=document.getElementById('score'),B=document.getElementById('best'),status=document.getElementById('status'),mute=document.getElementById('mute');let best=0;try{best=Number(localStorage.getItem('omj_best')||0)||0}catch{}B.textContent='BEST '+best;let audio=null,sound=true,mode='ready',t=0,score=0,spawn=0,obstacles=[],last=0,shake=0;const ground=402,p={x:132,y:ground-42,w:38,h:42,vy:0,jumps:0};function tone(freq,dur,type='sine'){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}function reset(){mode='playing';t=0;score=0;spawn=1;obstacles=[];p.y=ground-p.h;p.vy=0;p.jumps=0;S.textContent='SCORE 0';status.textContent='Playing — jump over the blocks.'}function jump(){if(mode!=='playing'){reset();tone(440,.08);return}if(p.jumps<2){p.vy=p.jumps===0?-720:-620;p.jumps++;tone(p.jumps===1?520:680,.09)}}function end(){mode='over';shake=9;tone(180,.25,'sawtooth');status.textContent='Game over. Tap or press Space to restart.';if(score>best){best=score;B.textContent='BEST '+best;try{localStorage.setItem('omj_best',String(best))}catch{}}}function input(e){if(e.type==='keydown'){if(!['Space','ArrowUp','KeyW'].includes(e.code)||e.repeat)return;e.preventDefault()}else if(e.target.closest?.('button,a'))return;jump()}c.addEventListener('pointerdown',input);document.addEventListener('keydown',input);document.getElementById('restart').onclick=()=>{reset();tone(520,.08)};mute.onclick=()=>{sound=!sound;mute.textContent=sound?'♫ Sound on':'♪ Muted';mute.setAttribute('aria-label',sound?'Mute sound':'Unmute sound')};function drawText(s,y,size=30){ctx.fillStyle='#f5f7fc';ctx.font=`800 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,400,y)}function frame(ms){let dt=Math.min((ms-last)/1000||0,.04);last=ms;if(mode==='playing'){t+=dt;const speed=Math.min(340+Math.floor(t/8)*30,590);p.vy+=1880*dt;p.y+=p.vy*dt;if(p.y>=ground-p.h){p.y=ground-p.h;p.vy=0;p.jumps=0}spawn-=dt;if(spawn<=0){let h=34+Math.random()*35;obstacles.push({x:840,w:28+Math.random()*22,h,passed:false});spawn=Math.max(.73,1.4-t*.012)+Math.random()*.35}for(const o of obstacles){o.x-=speed*dt;if(!o.passed&&o.x+o.w<p.x){o.passed=true;score++;S.textContent='SCORE '+score;tone(820,.045)}if(p.x+7<o.x+o.w&&p.x+p.w-7>o.x&&p.y+p.h-5>ground-o.h&&p.y+6<ground){end();break}}obstacles=obstacles.filter(o=>o.x+o.w>-30)}ctx.clearRect(0,0,800,500);let grad=ctx.createLinearGradient(0,0,0,500);grad.addColorStop(0,'#172840');grad.addColorStop(1,'#24405b');ctx.fillStyle=grad;ctx.fillRect(0,0,800,500);ctx.fillStyle='#ffffff12';for(let i=0;i<16;i++){let x=(i*97-(t*18)%97+800)%800;ctx.fillRect(x,65+(i*71)%220,3,3)}ctx.fillStyle='#2f5571';ctx.fillRect(0,ground,800,98);ctx.fillStyle='#74dbd1';ctx.fillRect(0,ground,800,5);ctx.fillStyle='#39637d';for(let x=-(t*110)%60;x<800;x+=60)ctx.fillRect(x,430,32,4);ctx.fillStyle='#ffcc6b';for(let o of obstacles){ctx.fillRect(o.x,ground-o.h,o.w,o.h);ctx.fillStyle='#ff9c70';ctx.fillRect(o.x+4,ground-o.h+5,o.w-8,6);ctx.fillStyle='#ffcc6b'}ctx.fillStyle='#75e4d6';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#12324b';ctx.fillRect(p.x+25,p.y+10,6,6);ctx.fillStyle='#ffffff70';ctx.fillRect(p.x+5,p.y+5,7,p.h-10);if(mode!=='playing'){ctx.fillStyle='#0b1427b8';ctx.fillRect(0,0,800,500);drawText(mode==='ready'?'ONE MORE JUMP':'GAME OVER',198,48);drawText(mode==='ready'?'Tap to start':'Score: '+score,251,27);drawText('Tap / Space to '+(mode==='ready'?'play':'try again'),306,22)}if(shake>0)shake--;requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
